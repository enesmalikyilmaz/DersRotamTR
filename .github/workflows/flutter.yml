name: Flutter

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter create --platforms=android --project-name=ders_rotam --org=tr.dersrotam .
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --dart-define=APP_ENV=prod
