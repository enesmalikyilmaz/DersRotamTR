name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore DersRotam.sln
      - run: dotnet build DersRotam.sln --no-restore --configuration Release
      - run: dotnet test DersRotam.sln --no-build --configuration Release
